```yaml
name: macOS Cloud Desktop

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Configure macOS Remote Desktop
        run: |
          VNC_PASSWORD="${{ secrets.VNC_PASSWORD }}"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure \
            -access -on \
            -users runner \
            -privs -all \
            -restart -agent

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Display connection information
        run: |
          echo "macOS desktop is running."
          echo "VNC port: 5900"
          echo "Use the Tailscale IP of this machine."
          tailscale ip -4

      - name: Keep desktop alive
        run: |
          echo "macOS desktop is available."
          sleep 18000
```
