name: macOS + Tailscale + Remote Desktop

on:
  workflow_dispatch:

jobs:
  secure-macos:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Configure macOS Remote Desktop
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ] || [ ${#VNC_PASSWORD} -gt 8 ]; then
            echo "Invalid VNC password."
            exit 1
          fi

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$KICKSTART" -activate
          sudo "$KICKSTART" -configure -access -on -users runner -privs -all
          sudo "$KICKSTART" -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"
          sudo "$KICKSTART" -restart -agent

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Get Tailscale IP
        shell: bash
        run: |
          for i in {1..20}; do
            TS_IP=$(tailscale ip -4 | head -n 1)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP unavailable."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify VNC
        shell: bash
        run: |
          sleep 10
          nc -z -w 5 "$TAILSCALE_IP" 5900

      - name: Display Connection
        run: |
          echo "================================"
          echo "       macOS REMOTE DESKTOP"
          echo "================================"
          echo "Address: $TAILSCALE_IP"
          echo "Port: 5900"
          echo "Protocol: VNC"
          echo "================================"

      - name: Keep Session Alive
        shell: bash
        run: |
          while true; do
            echo "[$(date)] macOS Desktop Active"
            sleep 300
          done
